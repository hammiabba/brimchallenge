# Alembic configuration for the app database. Migrations live in app/db/migrations/.
#
# Run from backend/:
#   alembic upgrade head          apply every migration
#   alembic downgrade base        revert every migration
#   alembic revision --autogenerate -m "add x" --rev-id 0002     new migration (review it by hand)
#
# The database URL is deliberately NOT set in this file. app/db/migrations/env.py takes it from app.db.database
# (DATABASE_URL / settings, relative SQLite paths resolved against the repo root). To migrate another database:
#   DATABASE_URL=sqlite:////absolute/path/to/test.db alembic upgrade head

[alembic]
# Folder holding env.py, script.py.mako and versions/. %(here)s is the directory of this file (backend/).
script_location = %(here)s/app/db/migrations

# Put backend/ on sys.path so env.py can `import app...` even without `pip install -e`.
prepend_sys_path = .

# Split multi-path options on the OS path separator (Alembic >= 1.16 option; older versions ignore it).
path_separator = os

# Migration file names: <revision>_<slug>.py, e.g. 0001_baseline.py. Pass --rev-id to keep 0001, 0002, ...
file_template = %%(rev)s_%%(slug)s

# Logging for the alembic command line. env.py loads these sections unless told not to.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

# WARNING keeps SQL statements out of the output; set INFO to see every statement.
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
